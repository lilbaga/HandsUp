    <main class="page-container">
        <h1>Запись на тренировку</h1>
        <p>Заполните форму ниже, чтобы записаться на пробную тренировку:</p>

        <form id="contact-form">
            <label for="username">Ваше имя:</label>
            <input type="text" id="username" name="username" placeholder="Введите имя" required>

            <label for="email">Ваш Email:</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>

            <label for="phone number">Ваш Номер телефона:</label>
            <input type="tel" id="phone number" name="phone number" placeholder="+7 (XXX) XXX-XX-XX" required>

            <label for="branch">Выберите филиал:</label>
            <select id="branch" name="branch">
                <option value="left">Филиал «Left Bank»</option>
                <option value="right">Филиал «Right Bank»</option>
            </select>

            <label for="message">Дополнительные пожелания:</label>
            <textarea id="message" name="message" rows="4" placeholder="Напишите ваши цели или вопросы..."></textarea>

            <button type="submit" class="btn">Отправить заявку</button>
        </form>
    </main>
